name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests and types.
  #
  # The suites that matter most here are units and pricing: a regression in
  # either misprices a job, and that is money out of a farmer's pocket.
  # ---------------------------------------------------------------------------
  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A keystore in the repository is not recoverable by deleting it: it
      # stays in the history, and the key that signs the app is the key that
      # lets anyone ship an update to a captain's phone.
      - name: No keystore or signing passwords
        run: |
          if git ls-files | grep -iE '\.(keystore|jks)$|keystore\.properties$|^gradle\.properties$'; then
            echo "::error::A keystore or signing properties file is tracked by git."
            exit 1
          fi
          if git grep -nIE 'ZAMINDARA_(STORE|KEY)_PASSWORD[[:space:]]*=[[:space:]]*[^[:space:]$]' -- . ':!docs/**' ':!.github/**'; then
            echo "::error::A signing password looks hard-coded outside the docs."
            exit 1
          fi

      # `supabase config push` copies [auth.sms.test_otp] to the HOSTED
      # project with a ten-year expiry. A test number is a permanent sign-in
      # backdoor: anyone who knows the number and its code IS that captain.
      #
      # The four numbers below are fictional fixtures (they match the pgTAP
      # test users) and exist so the whole login flow is testable with no SMS
      # provider. A real captain's number must never join them.
      - name: Only fixture numbers in test_otp
        run: |
          real=$(git grep -hE '^[0-9]{10,15}[[:space:]]*=' -- backend/supabase/config.toml                  | grep -vE '^(919876500001|919876500002|919876500003|919876500004)[[:space:]]*=' || true)
          if [ -n "$real" ]; then
            echo "::error::A phone number outside the fixture set is in config.toml. Real numbers must never be committed: supabase config push would make them permanent backdoors on the hosted project."
            echo "$real"
            exit 1
          fi

  test:
    name: Tests and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # Does the app still bundle?
  #
  # Typechecking is not enough. Metro resolves the workspace packages as
  # TypeScript source and rewrites their ESM .js specifiers; a broken import
  # passes tsc and fails here. This step has caught real breakage before.
  # ---------------------------------------------------------------------------
  bundle:
    name: Android bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Export Android bundle
        working-directory: frontend
        run: npx expo export --platform android --output-dir /tmp/export

  # ---------------------------------------------------------------------------
  # The database.
  #
  # This is the job that matters. The migrations have never run on the
  # founder's machine — Docker Desktop will not start its WSL backend — so
  # until now the schema has been written but unproven. Runners have Docker,
  # so CI is where it finally gets verified.
  #
  # It proves three things nothing else can: that a client cannot set its own
  # acreage, that a farmer's field boundary is invisible to strangers, and
  # that two captains contesting a job produce exactly one winner.
  # ---------------------------------------------------------------------------
  database:
    name: Schema and guarantees
    runs-on: ubuntu-latest
    # The Supabase CLI finds supabase/ relative to the working directory.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned. "latest" asks GitHub's API which release that is, and the
          # unauthenticated API rate-limits shared runners: it failed twice on
          # 20 Nov 2026. Bump by hand; this is the version the restore proof
          # was last run against.
          version: 3.2.0


      - name: Start Postgres and apply migrations
        run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit

      - name: Enable pgTAP
        # Test-only. Deliberately not a migration — pgTAP has no business in
        # the production database.
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -c 'create extension if not exists pgtap with schema extensions;'

      # A wrong plan fails a whole file even when every assertion passes, and
      # it has been miscounted by hand three times. Cheap to check, and it
      # fails in two seconds instead of after the containers boot.
      - name: Plan counts match the assertions
        run: bash ./check-plans.sh

      - name: Run guarantee tests
        run: supabase test db

      # The core loop, run by the app's own sync code against this database:
      # sign in, field, job, founder offers it, captain accepts and
      # completes, farmer sees it done. Also measures what a sync pass
      # downloads, which is how incremental sync is proven.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .

      - name: Core loop, end to end
        run: |
          eval "$(cd ../backend && supabase status -o env | sed 's/^/export /')"
          E2E_SUPABASE_URL="$API_URL"           E2E_SUPABASE_ANON_KEY="$ANON_KEY"           E2E_SUPABASE_SERVICE_KEY="$SERVICE_ROLE_KEY"             npx vitest run e2e --reporter=verbose
        working-directory: frontend

      # A backup that has never been restored does not count. Real rows go
      # in, get backed up and encrypted, the database is wiped back to what a
      # new Supabase project looks like, and the backup is restored into it.
      # Then the rows are compared, and the whole guarantee suite runs again
      # on the restored database: data that came back without its RLS or
      # triggers would pass a row count and fail here.
      - name: Backup, wipe, restore
        env:
          DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          BACKUP_PASSPHRASE: ci-only-not-a-secret
        run: |
          set -euo pipefail
          psql "$DB" -v ON_ERROR_STOP=1 -q -f scripts/restore-fixture.sql
          psql "$DB" -At -f scripts/restore-fingerprint.sql > /tmp/before.txt
          bash scripts/backup.sh "$DB" /tmp/backup.tar.gz.gpg
          if BACKUP_PASSPHRASE=wrong bash scripts/restore.sh /tmp/backup.tar.gz.gpg "$DB"; then
            echo "::error::a wrong passphrase restored the backup"; exit 1
          fi
          psql "$DB" -v ON_ERROR_STOP=1 -q -f scripts/wipe-to-new-project.sql
          bash scripts/restore.sh /tmp/backup.tar.gz.gpg "$DB"
          psql "$DB" -At -f scripts/restore-fingerprint.sql > /tmp/after.txt
          cat /tmp/before.txt
          diff /tmp/before.txt /tmp/after.txt
          echo "restored database matches the original"

      - name: Guarantee tests again, on the restored database
        run: supabase test db

      - name: Show logs on failure
        if: failure()
        run: supabase status && docker ps -a

      - name: Phone auth is configured, with codes for CI
        # Phone is the only way in — there is no email column and no password
        # in the schema. A config change that quietly disabled it would lock
        # every user out, and nothing else here would notice.
        run: |
          set -e
          grep -q '^\[auth.sms.test_otp\]' supabase/config.toml
          awk '/^\[auth.sms\]/{f=1} f&&/^enable_signup/{print; exit}' supabase/config.toml | grep -q 'true'
          echo "phone auth enabled with fixed test codes"
